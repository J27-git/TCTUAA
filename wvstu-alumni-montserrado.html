<style>
:root{
  --ink:#14284B; --ink-2:#1F3A68; --brass:#B8892B; --brass-text:#80600F;
  --canvas:#F3F5F8; --paper:#FFFFFF; --line:#D9DEE7; --line-soft:#E8ECF2;
  --text:#1B2230; --muted:#566172; --green:#1E6B4E; --green-bg:#E3F1EA;
  --red:#A32A2A; --red-bg:#F8E6E6; --amber:#8A5A00; --amber-bg:#FBF0DA;
  --blue-bg:#E6ECF7; --on-ink:#FFFFFF; --focus:#2F6FDE;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r-sm:4px; --r:8px; --r-lg:14px;
  --shadow:0 1px 2px rgba(20,40,75,.06), 0 4px 16px rgba(20,40,75,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#9DB8EA; --ink-2:#B9CDF2; --brass:#D6AE55; --brass-text:#E2BE6E;
    --canvas:#0E1422; --paper:#161F31; --line:#2A3650; --line-soft:#222C42;
    --text:#E6EAF1; --muted:#A3AEC2; --green:#6FCB9F; --green-bg:#16332A;
    --red:#F08A8A; --red-bg:#3A1C1F; --amber:#E9B75C; --amber-bg:#352A14;
    --blue-bg:#1B2742; --on-ink:#0E1422; --focus:#7FA8F5;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --ink:#9DB8EA; --ink-2:#B9CDF2; --brass:#D6AE55; --brass-text:#E2BE6E;
    --canvas:#0E1422; --paper:#161F31; --line:#2A3650; --line-soft:#222C42;
    --text:#E6EAF1; --muted:#A3AEC2; --green:#6FCB9F; --green-bg:#16332A;
    --red:#F08A8A; --red-bg:#3A1C1F; --amber:#E9B75C; --amber-bg:#352A14;
    --blue-bg:#1B2742; --on-ink:#0E1422; --focus:#7FA8F5;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--canvas); color:var(--text); font:16px/1.6 var(--sans); }
img{ max-width:100%; display:block; }
a{ color:var(--ink-2); text-underline-offset:3px; }
a:hover{ color:var(--brass-text); }
h1,h2,h3,h4{ font-family:var(--serif); color:var(--text); line-height:1.2; margin:0 0 .5em; font-weight:600; }
h1{ font-size:clamp(2rem,4.5vw,3.25rem); letter-spacing:-.01em; }
h2{ font-size:clamp(1.5rem,3vw,2.1rem); }
h3{ font-size:1.25rem; }
h4{ font-size:1.05rem; font-family:var(--sans); font-weight:600; }
p{ margin:0 0 1em; }
small,.small{ font-size:.875rem; }
.muted{ color:var(--muted); }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:3px; }
.skip{ position:absolute; left:-999px; top:8px; background:var(--paper); padding:8px 14px; z-index:100; }
.skip:focus{ left:8px; }
.wrap{ width:min(1180px,100% - 2.5rem); margin-inline:auto; }
.narrow{ width:min(760px,100% - 2.5rem); margin-inline:auto; }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }

/* Buttons & forms */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5em; font:600 .95rem/1 var(--sans); padding:.8em 1.2em; border-radius:var(--r); border:1px solid transparent; cursor:pointer; text-decoration:none; background:var(--ink); color:var(--on-ink); min-height:44px; }
.btn:hover{ background:var(--ink-2); color:var(--on-ink); }
.btn.brass{ background:var(--brass); color:#1b1405; }
.btn.brass:hover{ filter:brightness(1.07); color:#1b1405; }
.btn.ghost{ background:transparent; color:var(--ink-2); border-color:var(--line); }
.btn.ghost:hover{ border-color:var(--ink-2); background:var(--paper); }
.btn.danger{ background:var(--red); color:#fff; }
.btn.sm{ padding:.5em .8em; min-height:34px; font-size:.85rem; }
.btn.link{ background:none; border:0; color:var(--ink-2); padding:0; min-height:0; text-decoration:underline; font-weight:500; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btns{ display:flex; flex-wrap:wrap; gap:.6rem; }
label{ display:block; font-weight:600; font-size:.9rem; margin-bottom:.3rem; }
.field{ margin-bottom:1rem; }
.hint{ font-size:.82rem; color:var(--muted); font-weight:400; margin-top:.25rem; }
input,select,textarea{ width:100%; font:inherit; font-size:1rem; color:var(--text); background:var(--paper); border:1px solid var(--line); border-radius:var(--r-sm); padding:.65em .75em; min-height:44px; }
textarea{ min-height:120px; resize:vertical; }
input[type=checkbox],input[type=radio]{ width:auto; min-height:0; accent-color:var(--ink); }
input:focus,select:focus,textarea:focus{ border-color:var(--focus); outline:2px solid color-mix(in srgb,var(--focus) 30%,transparent); }
.check{ display:flex; gap:.6rem; align-items:flex-start; font-weight:400; }
.check input{ margin-top:.3rem; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 1rem; }
.grid3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0 1rem; }
.req::after{ content:" *"; color:var(--red); }
.err{ color:var(--red); font-size:.85rem; margin-top:.25rem; }
fieldset{ border:1px solid var(--line); border-radius:var(--r); padding:1rem 1.2rem .4rem; margin:0 0 1.2rem; }
legend{ font-family:var(--serif); font-weight:600; font-size:1.1rem; padding:0 .4rem; }
.hp{ position:absolute; left:-5000px; }

/* Header */
.topbar{ background:var(--ink); color:var(--on-ink); font-size:.88rem; }
:root[data-theme="dark"] .topbar{ background:#1F2E4D; color:#E6EAF1; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .topbar{ background:#1F2E4D; color:#E6EAF1; } }
.topbar .wrap{ display:flex; justify-content:space-between; gap:1rem; padding:.5rem 0; align-items:center; }
.topbar a{ color:inherit; }
.topbar .ann{ display:flex; gap:.6rem; align-items:center; min-width:0; }
.topbar .ann span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill{ display:inline-block; font-size:.75rem; font-weight:600; padding:.15em .6em; border-radius:99px; background:var(--blue-bg); color:var(--ink-2); white-space:nowrap; }
.pill.green{ background:var(--green-bg); color:var(--green); }
.pill.red{ background:var(--red-bg); color:var(--red); }
.pill.amber{ background:var(--amber-bg); color:var(--amber); }
.pill.grey{ background:var(--line-soft); color:var(--muted); }
.pill.brass{ background:var(--brass); color:#1b1405; }
header.site{ position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 94%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); }
header.site .wrap{ width:min(1480px,100% - 2rem); display:flex; align-items:center; gap:1.2rem; min-height:72px; }
.brand{ display:flex; align-items:center; gap:.7rem; text-decoration:none; color:var(--text); flex-shrink:0; }
.brand svg,.brand img{ width:44px; height:44px; }
.brand b{ display:block; font-family:var(--serif); font-size:1.02rem; line-height:1.15; }
.brand span{ display:block; font-size:.78rem; color:var(--muted); }
nav.main{ display:flex; gap:0; margin-left:auto; flex-wrap:nowrap; }
nav.main a{ text-decoration:none; color:var(--text); font-weight:500; font-size:.9rem; padding:.45rem .5rem; white-space:nowrap; border-radius:var(--r-sm); }
nav.main a:hover{ background:var(--canvas); color:var(--ink-2); }
nav.main a[aria-current="page"]{ color:var(--ink-2); box-shadow:inset 0 -2px 0 var(--brass); border-radius:0; }
.hdr-actions{ display:flex; gap:.5rem; align-items:center; flex-shrink:0; }
.hdr-actions .btn,.brand b{ white-space:nowrap; }
.theme-btn{ display:inline-grid; place-items:center; }
.menu-btn{ display:none; margin-left:auto; background:none; border:1px solid var(--line); border-radius:var(--r); width:44px; height:44px; color:var(--text); cursor:pointer; }
@media (max-width:1360px){
  nav.main,.hdr-actions{ display:none; }
  .menu-btn{ display:inline-flex; align-items:center; justify-content:center; }
  header.site.open nav.main{ display:flex; flex-direction:column; position:absolute; left:0; right:0; top:100%; background:var(--paper); border-bottom:1px solid var(--line); padding:.5rem 1.25rem 1rem; max-height:calc(100vh - 80px); overflow:auto; }
  header.site.open nav.main a{ padding:.8rem .4rem; border-bottom:1px solid var(--line-soft); }
  header.site.open nav.main a[aria-current="page"]{ box-shadow:inset 3px 0 0 var(--brass); padding-left:.8rem; }
  header.site.open nav.main .mob-actions{ display:flex; }
}
.mob-actions{ display:none; align-items:center; gap:.5rem; padding-top:.8rem; flex-wrap:wrap; }

/* Sections */
main{ min-height:60vh; }
.section{ padding:clamp(3rem,7vw,5.5rem) 0; }
.section.tight{ padding:clamp(2rem,4vw,3rem) 0; }
.section.paper{ background:var(--paper); border-block:1px solid var(--line); }
.section.ink{ background:var(--ink); color:var(--on-ink); }
.section.ink h2,.section.ink h3{ color:var(--on-ink); }
.sec-head{ display:flex; justify-content:space-between; align-items:end; gap:1rem; margin-bottom:1.8rem; flex-wrap:wrap; }
.sec-head h2{ margin:0; }
.lede{ font-size:1.15rem; color:var(--muted); max-width:62ch; }
.page-head{ background:var(--paper); border-bottom:1px solid var(--line); padding:clamp(2rem,5vw,3.5rem) 0 clamp(1.5rem,3vw,2.2rem); }
.page-head h1{ margin-bottom:.3em; }
.crumbs{ font-size:.85rem; color:var(--muted); margin-bottom:.8rem; }
.crumbs a{ color:var(--muted); }
.prose{ max-width:70ch; }
.prose p{ line-height:1.75; }
.prose h2{ margin-top:1.6em; }
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); padding:clamp(1.1rem,2.5vw,1.8rem); }
.split{ display:grid; grid-template-columns:1.1fr .9fr; gap:clamp(1.5rem,4vw,4rem); align-items:start; }
@media (max-width:860px){ .split{ grid-template-columns:1fr; } }
.empty{ text-align:center; padding:2.5rem 1rem; color:var(--muted); border:1px dashed var(--line); border-radius:var(--r-lg); background:var(--paper); }
.empty h3{ color:var(--text); }

/* Hero */
.hero{ background:var(--paper); border-bottom:1px solid var(--line); overflow:hidden; position:relative; }
.hero .wrap{ display:grid; grid-template-columns:1.15fr .85fr; gap:clamp(2rem,5vw,4.5rem); align-items:center; padding:clamp(2.5rem,6vw,5rem) 0; }
.hero h1{ font-size:clamp(2.1rem,5vw,3.6rem); line-height:1.05; margin-bottom:.35em; }
.hero h1 small{ display:block; font-size:.5em; font-weight:500; color:var(--brass-text); margin-top:.45em; font-style:italic; }
.hero .tag{ font-size:1.2rem; color:var(--muted); margin-bottom:1.8rem; max-width:46ch; }
.hero-bg{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:.14; pointer-events:none; }
.hero-card{ position:relative; }
.hero-card .mcard{ transform:rotate(-2.5deg); box-shadow:0 30px 60px -20px rgba(20,40,75,.45), 0 8px 20px rgba(20,40,75,.15); }
.hero-verify{ margin-top:2.2rem; background:var(--canvas); border:1px solid var(--line); border-radius:var(--r-lg); padding:1rem 1.1rem; }
.hero-verify form{ display:flex; gap:.5rem; }
.hero-verify input{ font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.02em; }
@media (max-width:860px){ .hero .wrap{ grid-template-columns:1fr; } .hero-card .mcard{ transform:none; } }

/* Membership card */
.mcard{ --c-ink:#14284B; aspect-ratio:1.586; width:100%; max-width:440px; border-radius:16px; background:linear-gradient(155deg,#1B3561 0%,#14284B 55%,#0F1F3C 100%); color:#fff; padding:5.5% 6%; display:grid; grid-template-rows:auto 1fr auto; position:relative; overflow:hidden; font-family:var(--sans); }
.mcard::before{ content:""; position:absolute; inset:7px; border:1px solid rgba(214,174,85,.55); border-radius:11px; pointer-events:none; }
.mcard .mc-top{ display:flex; align-items:center; gap:.6rem; }
.mcard .mc-top svg,.mcard .mc-top img{ width:13%; min-width:34px; height:auto; }
.mcard .mc-org{ font-size:clamp(.55rem,1.6vw,.72rem); line-height:1.25; opacity:.92; }
.mcard .mc-org b{ font-family:var(--serif); font-size:1.18em; display:block; color:#E8C878; }
.mcard .mc-body{ display:grid; grid-template-columns:auto 1fr auto; gap:5%; align-items:center; margin-top:4%; }
.mcard .mc-photo{ width:clamp(54px,17vw,86px); aspect-ratio:3/3.6; border-radius:8px; background:#2A4777; overflow:hidden; display:grid; place-items:center; font:600 1.5rem var(--serif); color:#E8C878; border:2px solid rgba(232,200,120,.6); }
.mcard .mc-photo img{ width:100%; height:100%; object-fit:cover; }
.mcard .mc-name{ font-family:var(--serif); font-size:clamp(.95rem,2.8vw,1.3rem); font-weight:600; line-height:1.15; }
.mcard .mc-meta{ font-size:clamp(.58rem,1.7vw,.75rem); opacity:.85; margin-top:.3rem; line-height:1.45; }
.mcard .mc-no{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:clamp(.68rem,2vw,.9rem); letter-spacing:.06em; color:#E8C878; margin-top:.35rem; }
.mcard .mc-qr{ background:#fff; padding:5px; border-radius:6px; width:clamp(58px,17vw,92px); }
.mcard .mc-qr svg{ width:100%; height:auto; display:block; }
.mcard .mc-foot{ display:flex; justify-content:space-between; font-size:clamp(.55rem,1.5vw,.7rem); opacity:.85; align-items:end; }
.mcard .mc-status{ font-weight:700; color:#8FE0B5; }
.mcard .mc-status.bad{ color:#FFB4B4; }

/* Content blocks */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1.2rem; }
.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column; }
.card .body{ padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; gap:.4rem; flex:1; }
.card h3{ font-size:1.15rem; margin:0; }
.card h3 a{ color:var(--text); text-decoration:none; }
.card h3 a:hover{ color:var(--ink-2); text-decoration:underline; }
.thumb{ aspect-ratio:16/9; background:var(--line-soft); overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:cover; }
.meta{ font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.3rem .9rem; }
.ev-row{ display:grid; grid-template-columns:84px 1fr auto; gap:1.2rem; align-items:center; padding:1.2rem 0; border-bottom:1px solid var(--line); }
.ev-row:first-child{ border-top:1px solid var(--line); }
.datebox{ text-align:center; border:1px solid var(--line); border-radius:var(--r); background:var(--paper); overflow:hidden; }
.datebox .m{ background:var(--ink); color:var(--on-ink); font-size:.78rem; font-weight:600; padding:.2rem 0; }
.datebox .d{ font:600 1.9rem/1.2 var(--serif); padding:.2rem 0 0; }
.datebox .y{ font-size:.75rem; color:var(--muted); padding-bottom:.3rem; }
.ev-row h3{ margin:0 0 .25rem; font-size:1.2rem; }
.ev-row h3 a{ color:var(--text); text-decoration:none; }
.ev-row h3 a:hover{ text-decoration:underline; }
@media (max-width:640px){ .ev-row{ grid-template-columns:64px 1fr; } .ev-row > :last-child{ grid-column:2; } }
.leader-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:1.5rem 1.2rem; }
.leader .portrait{ aspect-ratio:4/5; border-radius:var(--r-lg); overflow:hidden; background:var(--blue-bg); display:grid; place-items:center; margin-bottom:.8rem; border:1px solid var(--line); }
.leader .portrait img{ width:100%; height:100%; object-fit:cover; }
.leader .portrait .ini{ font:600 3rem var(--serif); color:var(--ink-2); }
.leader h3{ margin:0; font-size:1.12rem; }
.leader .pos{ color:var(--brass-text); font-weight:600; font-size:.9rem; }
.avatar{ width:40px; height:40px; border-radius:50%; display:inline-grid; place-items:center; font:600 .9rem var(--sans); color:#fff; flex-shrink:0; overflow:hidden; }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.avatar.lg{ width:88px; height:88px; font-size:1.8rem; }
.feature-news{ display:grid; grid-template-columns:1.3fr 1fr; gap:2rem; }
@media (max-width:860px){ .feature-news{ grid-template-columns:1fr; } }
.news-list{ list-style:none; margin:0; padding:0; }
.news-list li{ padding:1rem 0; border-bottom:1px solid var(--line); }
.news-list li:first-child{ padding-top:0; }
.news-list a{ color:var(--text); text-decoration:none; font-family:var(--serif); font-weight:600; font-size:1.1rem; line-height:1.3; }
.news-list a:hover{ color:var(--ink-2); text-decoration:underline; }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); border-top:1px solid var(--line); }
.stat-row div{ padding:1.2rem 1rem 0 0; }
.stat-row b{ display:block; font:600 2rem/1.1 var(--serif); color:var(--ink-2); }
.stat-row span{ color:var(--muted); font-size:.9rem; }
.quote{ font-family:var(--serif); font-size:clamp(1.2rem,2.4vw,1.55rem); line-height:1.5; font-style:italic; border-left:3px solid var(--brass); padding-left:1.3rem; margin:0 0 1.2rem; }
.gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.8rem; }
.gallery-grid button{ padding:0; border:0; background:none; cursor:zoom-in; border-radius:var(--r); overflow:hidden; aspect-ratio:4/3; }
.gallery-grid img{ width:100%; height:100%; object-fit:cover; }
.mosaic{ display:grid; grid-template-columns:2fr 1fr 1fr; grid-template-rows:repeat(2,minmax(120px,190px)); gap:.7rem; }
.mosaic a{ border-radius:var(--r); overflow:hidden; display:block; }
.mosaic a:first-child{ grid-row:span 2; }
.mosaic img{ width:100%; height:100%; object-fit:cover; }
@media (max-width:640px){ .mosaic{ grid-template-columns:1fr 1fr; grid-template-rows:auto; } .mosaic a:first-child{ grid-column:span 2; grid-row:auto; aspect-ratio:16/9; } .mosaic a{ aspect-ratio:1; } }
.doc-row{ display:flex; gap:1rem; align-items:center; padding:.9rem 0; border-bottom:1px solid var(--line); }
.doc-ico{ width:42px; height:50px; border:1px solid var(--line); border-radius:4px; display:grid; place-items:center; font-size:.68rem; font-weight:700; color:var(--ink-2); background:var(--paper); flex-shrink:0; }
.filters{ display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1.2rem; align-items:end; }
.filters > *{ flex:1 1 170px; }
.filters .field{ margin:0; }
.chips{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1.2rem; }
.chip{ border:1px solid var(--line); background:var(--paper); color:var(--text); border-radius:99px; padding:.35rem .85rem; font:500 .88rem var(--sans); cursor:pointer; text-decoration:none; }
.chip[aria-pressed="true"],.chip.on{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.dir-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
.dir-card{ display:flex; gap:.9rem; padding:1rem; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); }
.dir-card h3{ font-size:1.05rem; margin:0; }
.steps{ display:flex; gap:.4rem; margin-bottom:1.5rem; flex-wrap:wrap; counter-reset:s; list-style:none; padding:0; }
.steps li{ flex:1 1 120px; font-size:.85rem; color:var(--muted); border-top:3px solid var(--line); padding-top:.5rem; }
.steps li.on{ border-color:var(--brass); color:var(--text); font-weight:600; }

.side a{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.55rem .7rem; border-radius:var(--r-sm); color:var(--text); text-decoration:none; font-size:.93rem; }
.side a:hover{ background:var(--canvas); }
.side a[aria-current="page"]{ background:var(--blue-bg); color:var(--ink-2); font-weight:600; }

.kpi span{ font-size:.85rem; color:var(--muted); }

.chart-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:1rem; }

.table-wrap{ overflow-x:auto; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); }

/* Dialog & toasts */

.dlg-head h2{ font-size:1.3rem; margin:0; }

.x{ background:none; border:0; font-size:1.6rem; line-height:1; cursor:pointer; color:var(--muted); width:40px; height:40px; }
.lightbox{ background:#000; border:0; width:min(1100px,100% - 1rem); }
.lightbox img{ width:100%; max-height:78vh; object-fit:contain; }

.toast.error{ background:var(--red); color:#fff; }
.toast.ok{ background:var(--green); color:#fff; }
:root[data-theme="dark"] .toast.ok,:root[data-theme="dark"] .toast.error{ color:#0E1422; }
@keyframes tin{ from{ transform:translateY(8px); opacity:0; } }
.demo-box{ background:var(--amber-bg); border:1px solid color-mix(in srgb,var(--amber) 35%,transparent); border-radius:var(--r-lg); padding:1rem 1.1rem; font-size:.9rem; }
.demo-box table{ font-size:.85rem; }
.demo-box td,.demo-box th{ padding:.35rem .4rem; background:transparent; }
.ticket{ border:2px dashed var(--line); border-radius:var(--r-lg); padding:1rem; display:flex; gap:1rem; align-items:center; background:var(--paper); }
.ticket .qr{ width:110px; background:#fff; padding:6px; border-radius:6px; flex-shrink:0; }
.ticket .qr svg{ width:100%; height:auto; display:block; }
.theme-btn{ background:none; border:1px solid var(--line); color:var(--text); border-radius:var(--r); height:40px; width:40px; cursor:pointer; }

@media print{
  header.site,footer.site,.topbar,.side,.no-print,#toasts,.app-head .toolbar{ display:none!important; }
  .app{ display:block; }
  body{ background:#fff; }
  .table-wrap{ border:0; overflow:visible; }
  .mcard{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>

<script>
'use strict';
/* ============ Helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => new Date(new Date(d).getTime() + n * DAY).toISOString().slice(0, 10);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d, opts) { if (!d) return '—'; const x = new Date(d.length === 10 ? d + 'T12:00:00' : d); if (isNaN(x)) return '—'; return x.toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtDT(d) { if (!d) return '—'; const x = new Date(d); return x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + x.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`; }
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const AV_COLORS = ['#1F3A68','#2E5E4E','#6B3E75','#7A4B1E','#1E5B73','#5A2E2E','#3E4F7A','#4A5D23'];
function hashStr(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function avatar(m, cls = '') { const n = fullName(m); if (m && m.photo) return `<span class="avatar ${cls}"><img src="${esc(m.photo)}" alt=""></span>`; return `<span class="avatar ${cls}" style="background:${AV_COLORS[hashStr(n) % AV_COLORS.length]}" aria-hidden="true">${esc(initials(n))}</span>`; }
function fullName(m, withMiddle) { if (!m) return ''; return [m.first, withMiddle ? m.middle : '', m.last].filter(Boolean).join(' '); }
function displayName(m) { if (!m) return ''; return (m.preferred ? m.preferred : m.first) + ' ' + m.last; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function fileSize(n) { if (!n) return '—'; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4200); }
async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function hashPw(pw, salt) { return sha256(salt + '::' + pw); }
function readFileAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function resizeImage(file, max = 1000, q = .78) {
  const src = await readFileAsDataURL(file);
  if (file.type === 'image/svg+xml') return src;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e).trim()); }
function pwProblems(pw) { const p = []; if (pw.length < 8) p.push('at least 8 characters'); if (!/[A-Z]/.test(pw)) p.push('an uppercase letter'); if (!/[0-9]/.test(pw)) p.push('a number'); return p; }

/* ============ Emblem (original placeholder mark) ============ */
function emblem(size = 44) {
  if (S && S.settings.logo) return `<img src="${esc(S.settings.logo)}" alt="" width="${size}" height="${size}" style="object-fit:contain">`;
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><path d="M32 3 56 11v20c0 15-10.5 25.5-24 30C18.5 56.5 8 46 8 31V11z" fill="#14284B" stroke="#C99A3A" stroke-width="2.5"/><path d="M17 40c5-2.4 10-2.4 15 .6 5-3 10-3 15-.6V24c-5-2.4-10-2.4-15 .6-5-3-10-3-15-.6z" fill="#fff"/><path d="M32 24.6V40.6" stroke="#14284B" stroke-width="1.6"/><path d="m32 9.5 1.9 4 4.3.4-3.3 2.9 1 4.2L32 18.8 28.1 21l1-4.2-3.3-2.9 4.3-.4z" fill="#E1B95A"/><path d="M20 47h24" stroke="#C99A3A" stroke-width="2"/></svg>`;
}

/* ============ QR ============ */
function qrSVG(text, cell = 4) {
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" role="img" aria-label="QR code"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></svg>`;
  } catch (e) { return `<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#eee"/></svg>`; }
}
function qrMatrix(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q; }
function pageBase() { try { return location.href.split('#')[0]; } catch (e) { return ''; } }
function verifyURL(no) { return pageBase() + '#/verify/' + encodeURIComponent(no); }

/* ============ Placeholder art (sample images) ============ */
function sampleArt(seed, label, w = 800, h = 600) {
  const R = mulberry32(hashStr(seed)); const pal = [['#1B3561','#2E5E8C','#C99A3A'],['#1E5B4E','#3E8A6E','#E1B95A'],['#3E2E5A','#6B4E8C','#E8A45A'],['#5A3A1E','#8C5E2E','#F0C878'],['#14284B','#3A6EA5','#9BC3E6']][Math.floor(R() * 5)];
  let shapes = '';
  for (let i = 0; i < 7; i++) { const x = R() * w, y = h * .45 + R() * h * .5, r = 30 + R() * 90; shapes += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="${pal[i % 3]}" opacity="${(.35 + R() * .4).toFixed(2)}"/>`; }
  for (let i = 0; i < 5; i++) { const x = 60 + i * (w - 120) / 4 + (R() - .5) * 40, hh = 90 + R() * 70; shapes += `<rect x="${(x - 16).toFixed(0)}" y="${(h - hh - 40).toFixed(0)}" width="32" height="${hh.toFixed(0)}" rx="16" fill="#0d1a30" opacity=".55"/><circle cx="${x.toFixed(0)}" cy="${(h - hh - 62).toFixed(0)}" r="20" fill="#0d1a30" opacity=".55"/>`; }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/>${shapes}<rect y="${h - 40}" width="${w}" height="40" fill="#0d1a30" opacity=".5"/><text x="18" y="${h - 14}" font-family="Arial" font-size="15" fill="#fff" opacity=".85">Sample image: ${String(label).replace(/[<&>]/g, '')}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============ Roles & permissions ============ */
const MODULES = [
  ['dashboard','Dashboard'],['members','Members'],['applications','Applications'],['categories','Membership categories'],
  ['leadership','Leadership'],['pages','Pages & About'],['news','News'],['announcements','Announcements'],['events','Events'],
  ['gallery','Gallery'],['documents','Documents'],['communications','Communications'],['messages','Contact messages'],
  ['reports','Reports'],['settings','Site settings'],['users','Users & roles'],['audit','Audit log']
];
const ROLES = {
  super: { name: 'Super Administrator', perms: Object.fromEntries(MODULES.map(([k]) => [k, 'rw'])) },
  chapter: { name: 'Chapter Administrator', perms: Object.fromEntries(MODULES.map(([k]) => [k, (k === 'users' || k === 'audit') ? 'r' : 'rw'])) },
  membership: { name: 'Membership Administrator', perms: { dashboard: 'r', members: 'rw', applications: 'rw', categories: 'rw', reports: 'r' } },
  content: { name: 'Content Editor', perms: { dashboard: 'r', leadership: 'rw', pages: 'rw', news: 'rw', announcements: 'rw', gallery: 'rw', documents: 'rw' } },
  events: { name: 'Events Administrator', perms: { dashboard: 'r', events: 'rw', reports: 'r' } },
  finance: { name: 'Finance/Reporting Administrator', perms: { dashboard: 'r', members: 'r', reports: 'rw' } },
  viewer: { name: 'Viewer/Staff', perms: Object.fromEntries(MODULES.filter(([k]) => !['settings','users','audit','messages'].includes(k)).map(([k]) => [k, 'r'])) },
  member: { name: 'Member', perms: {} }
};

/* ============ State ============ */
const LS_KEY = 'wvstu-mon-demo-v1';
let S = null;
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
    catch (e) { if (!save.warned) { toast('This browser\u2019s storage is full, so recent demo changes won\u2019t survive a reload. Remove some uploaded images to free space.', 'error'); save.warned = true; } }
  }, 120);
}
function loadState() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 3) return s; } } catch (e) {} return null; }
const col = name => S[name];
const byId = (name, id) => S[name].find(x => x.id === id);
const chapter = () => S.chapters.find(c => c.id === S.activeChapter) || S.chapters[0];
const catName = id => (byId('categories', id) || {}).name || '—';

function audit(action, record = '', detail = '') {
  const u = currentUser();
  S.audit.unshift({ id: uid('a'), ts: new Date().toISOString(), user: u ? u.email : 'public visitor', action, record, detail, ip: 'client (demo)' });
  if (S.audit.length > 600) S.audit.length = 600;
  save();
}

/* ============ Seed ============ */

async function hashSeedPasswords() {
  let changed = false;
  for (const u of S.users) if (u.pw) { u.salt = uid('s'); u.hash = await hashPw(u.pw, u.salt); delete u.pw; changed = true; }

function currentMember() { const u = currentUser(); return u && u.memberId ? byId('members', u.memberId) : null; }
function isAdmin(u = currentUser()) { return !!u && u.roles.some(r => r !== 'member'); }
function can(module, mode = 'r') { const u = currentUser(); if (!u) return false; return u.roles.some(r => { const p = (ROLES[r] || {}).perms || {}; return p[module] && p[module].includes(mode); }); }

async function login(email, pw) {
  email = String(email).trim().toLowerCase();
  const lock = S.lockouts[email];
  if (lock && lock.until > Date.now()) return { error: `Too many failed attempts. Try again in ${Math.ceil((lock.until - Date.now()) / 1000)} seconds.` };
  const u = S.users.find(x => x.email.toLowerCase() === email);
  const ok = u && u.hash === await hashPw(pw, u.salt);
  if (!ok) {
    const l = S.lockouts[email] || { n: 0, until: 0 }; l.n++; if (l.n >= 5) { l.until = Date.now() + 60000; l.n = 0; } S.lockouts[email] = l; save();
    audit('Failed login', email);
    return { error: 'That email and password don\u2019t match an account. Check both and try again.' };
  }
  if (!u.active) return { error: 'This account has been deactivated. Contact the chapter office.' };
  delete S.lockouts[email];
  S.session = { userId: u.id, at: Date.now() }; save();
  audit('Login', u.email);
  return { user: u };
}
function logout() { const u = currentUser(); if (u) audit('Logout', u.email); S.session = null; save(); go('#/'); toast('Logged out.'); }

function hbars(data, max) { max = max || Math.max(1, ...data.map(d => d[1])); if (!data.length) return '<p class="muted small">No data for this filter.</p>'; return data.map(([l, v]) => `<div class="hbar" title="${esc(l)}: ${v}"><span class="lbl">${esc(l)}</span><span class="track"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%;display:block"></span></span><b>${v}</b></div>`).join(''); }
function vbars(data, h = 180) {
  if (!data.length) return '<p class="muted small">No data.</p>';
  const W = Math.max(320, data.length * 34), max = Math.max(1, ...data.map(d => d[1])), bw = W / data.length;
  return `<div class="chart" style="overflow-x:auto"><svg viewBox="0 -12 ${W} ${h + 34}" style="min-width:${Math.min(W, 520)}px" role="img" aria-label="Bar chart">${data.map(([l, v], i) => { const bh = v / max * h; return `<g><title>${esc(l)}: ${v}</title><rect class="bar" x="${i * bw + bw * .18}" y="${h - bh}" width="${bw * .64}" height="${Math.max(bh, 1)}" rx="3"/><text x="${i * bw + bw / 2}" y="${h - bh - 4}" text-anchor="middle">${v}</text><text x="${i * bw + bw / 2}" y="${h + 16}" text-anchor="middle">${esc(String(l).slice(-4))}</text></g>`; }).join('')}<line x1="0" x2="${W}" y1="${h}" y2="${h}" stroke="var(--line)"/></svg></div>`;
}
function lineChart(data, h = 190) {
  if (data.length < 2) return '<p class="muted small">Not enough data yet.</p>';
  const W = 560, max = Math.max(1, ...data.map(d => d[1])), step = W / (data.length - 1);
  const pts = data.map(([, v], i) => [i * step, h - v / max * (h - 10)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  return `<div class="chart"><svg viewBox="-8 -10 ${W + 16} ${h + 34}" role="img" aria-label="Line chart"><path d="${d}L${W},${h}L0,${h}Z" fill="var(--ink)" opacity=".08"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>${pts.map((p, i) => `<g><title>${esc(data[i][0])}: ${data[i][1]}</title><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/></g>`).join('')}${data.map(([l], i) => i % Math.ceil(data.length / 7) === 0 || i === data.length - 1 ? `<text x="${i * step}" y="${h + 18}" text-anchor="middle">${esc(l)}</text>` : '').join('')}<line x1="0" x2="${W}" y1="${h}" y2="${h}" stroke="var(--line)"/></svg></div>`;
}
function donut(parts) {
  const total = parts.reduce((a, p) => a + p[1], 0) || 1; let acc = 0; const R = 60, C = 2 * Math.PI * R;
  const segs = parts.map(([l, v, c]) => { const len = v / total * C; const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${c}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"><title>${esc(l)}: ${v}</title></circle>`; acc += len; return s; }).join('');
  return `<div style="display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Donut chart">${segs}<text x="80" y="78" text-anchor="middle" style="font:600 26px var(--serif);fill:var(--text)">${total}</text><text x="80" y="98" text-anchor="middle" style="font:12px var(--sans);fill:var(--muted)">members</text></svg><div class="legend" style="flex-direction:column;gap:.4rem">${parts.map(([l, v, c]) => `<span><i style="background:${c}"></i>${esc(l)}: <b>${v}</b> (${Math.round(v / total * 100)}%)</span>`).join('')}</div></div>`;
}
function countBy(arr, fn) { const m = {}; arr.forEach(x => { const k = fn(x); if (k !== '' && k != null) m[k] = (m[k] || 0) + 1; }); return Object.entries(m); }

async function saveFile(filename, data) {

function collectForm(form) {
  const fd = new FormData(form); const o = {};
  for (const [k, v] of fd.entries()) if (typeof v === 'string') o[k] = v.trim();
  const pv = {}; let hasPv = false;
  $$('input[type=checkbox][name^="pv_"]', form).forEach(c => { pv[c.name.slice(3)] = c.checked; hasPv = true; });
  if (hasPv) o.privacy = pv;
  Object.keys(o).forEach(k => { if (k.startsWith('pv_')) delete o[k]; });
  return o;
}

  }

  const probs = pwProblems(d.password || ''); if (probs.length) return err.textContent = 'Your password needs ' + probs.join(', ') + '.';
  if (d.password !== d.password2) return err.textContent = 'The two passwords don\u2019t match.';
  const mid = uid('m'); const salt = uid('s');
  const m = { id: mid, memberNo: '', first: d.first, middle: d.middle || '', last: d.last, preferred: d.preferred || '', gender: d.gender, dob: d.dob || '', photo: d.photo || '', phone: d.phone, email: d.email.toLowerCase(), address: d.address || '', city: d.city, county: d.county, country: d.country || 'Liberia', studentId: d.studentId, college: d.college, department: d.department, program: d.program, degree: d.degree, gradYear: +d.gradYear, gradStatus: d.gradStatus, admissionYear: d.admissionYear ? +d.admissionYear : '', campus: d.campus, classOf: 'Class of ' + d.gradYear, employer: d.employer || '', jobTitle: d.jobTitle || '', industry: d.industry || '', skills: d.skills || '', business: d.business || '', website: d.website || '', linkedin: d.linkedin || '', categoryId: d.categoryId, dateJoined: '', status: 'unverified', chapterId: S.activeChapter, expiry: '', emergency: d.emergency || '', privacy: d.privacy || { public: true }, createdAt: new Date().toISOString(), note: '', payments: [] };
  S.members.push(m);

function fieldHTML(f, v) {

function formDialog({ title, fields, values = {}, onSave, saveLabel = 'Save', wide = false }) {

  const rows = []; let buf = [];
  fields.forEach(f => { if (f.half) { buf.push(f); if (buf.length === 2) { rows.push(`<div class="grid2">${buf.map(x => fieldHTML(x, UI.dyn.values)).join('')}</div>`); buf = []; } } else { if (buf.length) { rows.push(`<div class="grid2">${buf.map(x => fieldHTML(x, UI.dyn.values)).join('')}</div>`); buf = []; } rows.push(fieldHTML(f, UI.dyn.values)); } });

async function submitDyn(form) {
  const { fields, values, onSave } = UI.dyn; const out = { ...values }; const err = $('#dyn-err');
  for (const f of fields) {
    if (!f.name || ['image', 'file', 'html'].includes(f.type)) continue;
    const el = form.elements[f.name]; if (!el) continue;
    if (f.type === 'checkbox') out[f.name] = el.checked;
    else if (f.type === 'number') out[f.name] = el.value === '' ? '' : Number(el.value);
    else out[f.name] = el.value.trim();
    if (f.req && (out[f.name] === '' || out[f.name] == null)) { err.textContent = `${f.label} is required.`; el.focus(); return; }
    if (f.type === 'email' && out[f.name] && !validEmail(out[f.name])) { err.textContent = `Enter a valid email address for ${f.label.toLowerCase()}.`; el.focus(); return; }
  }
  for (const f of fields) if (f.type === 'file' && f.req && !out[f.name]) { err.textContent = `Choose a file for ${f.label.toLowerCase()}.`; return; }
  const r = await onSave(out); if (typeof r === 'string') { err.textContent = r; return; }

}
